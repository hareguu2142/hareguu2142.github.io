<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>API 테스트</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
    textarea { width: 100%; height: 100px; padding: 10px; box-sizing: border-box; }
    button { padding: 10px 16px; cursor: pointer; }
    pre { background: #f5f5f5; padding: 12px; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>
  <h1>Gemini API 호출</h1>

  <label for="prompt">프롬프트</label>
  <textarea id="prompt">안녕</textarea>
  <p><button id="send">보내기</button></p>

  <h3>응답</h3>
  <pre id="out">아직 없음</pre>

  <script>
    const out = document.getElementById('out');
    document.getElementById('send').addEventListener('click', async () => {
      const prompt = document.getElementById('prompt').value.trim();
      out.textContent = '요청 중...';

      try {
        const res = await fetch('https://gemini-api-2k2u.onrender.com/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt })
        });

        const ct = res.headers.get('content-type') || '';
        if (!res.ok) {
          const text = await res.text();
          throw new Error(`HTTP ${res.status}: ${text}`);
        }

        if (ct.includes('application/json')) {
          const data = await res.json();
          out.textContent = JSON.stringify(data, null, 2);
        } else {
          const text = await res.text();
          out.textContent = text;
        }
      } catch (err) {
        out.textContent = '에러: ' + err.message;
      }
    });
  </script>
</body>
</html>
