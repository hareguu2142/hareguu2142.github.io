<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>나이스 생활기록부 계산기</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { --bg:#0b0e14; --card:#111521; --muted:#8a93a6; --txt:#e6e9ef; --accent:#6ea8fe; }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 32px; background: var(--bg); color: var(--txt);
      font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", Apple SD Gothic Neo, sans-serif;
    }
    .wrap { max-width: 820px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 16px; }
    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0));
      border: 1px solid #1b2336; border-radius: 14px; padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }
    textarea {
      width: 100%; min-height: 140px; resize: vertical; padding: 14px 16px;
      background: var(--card); color: var(--txt); border-radius: 10px;
      border: 1px solid #1b2336; outline: none; font-size: 15px;
    }
    textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(110,168,254,0.15); }
    .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap: 12px; margin-top: 16px; }
    .metric {
      background: var(--card); border: 1px solid #1b2336; border-radius: 10px; padding: 12px 14px;
    }
    .metric .label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .metric .value { font: 600 22px/1.1 ui-rounded, "Noto Sans KR", system-ui, sans-serif; }
    .small { font-size: 12px; color: var(--muted); }
    code { background:#141a2a; border:1px solid #222b45; padding:2px 6px; border-radius:6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1><code>나이스 생활기록부</code> 계산기</h1>
    <div class="card">
      <label for="txt" class="small">텍스트 입력</label>
      <textarea id="txt" placeholder="여기에 텍스트를 입력하세요."></textarea>

      <div class="row">
        <div class="metric">
          <div class="label">문자 수</div>
          <div class="value" id="len">0</div>
        </div>
        <div class="metric">
          <div class="label">나이스 바이트 수</div>
          <div class="value" id="result">0</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // LEN: 유니코드 코드포인트 기준 문자 수 (Google 시트의 LEN에 근사)
    function lenChars(text) {
      return Array.from(text).length; // 코드포인트 단위 분해 → 서로게이트 쌍 안전
    }

    // LENB: "ASCII=1, 비ASCII=2" 규칙 (KO/JP/CN 로캘의 LENB 동작 단순화)
    function lenBytesDoubleByteRule(text) {
      let bytes = 0;
      for (const ch of text) {
        const cp = ch.codePointAt(0);
        bytes += (cp <= 0x7F) ? 1 : 2;
      }
      return bytes;
    }

    // 나이스 바이트 수 = 2*LENB(text) - LEN(text)
    function compute() {
      const text = document.getElementById('txt').value || '';
      const L  = lenChars(text);                 // LEN
      const LB = lenBytesDoubleByteRule(text);   // LENB (DBCS 규칙)
      const result = 2 * LB - L;                 // =2*LENB()-LEN()

      document.getElementById('len').textContent = L;
      document.getElementById('result').textContent = result;
    }

    // 입력 이벤트에 반응
    document.getElementById('txt').addEventListener('input', compute);

    // 초기 계산
    compute();
  </script>
</body>
</html>
